name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain
        run: rustup toolchain install stable --profile minimal --component clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (default features)
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy (quic-decrypt)
        run: cargo clippy --all-targets --features quic-decrypt -- -D warnings

  test-msrv:
    name: test (MSRV 1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MSRV toolchain
        run: rustup toolchain install 1.88.0 --profile minimal
      - uses: Swatinem/rust-cache@v2
      - name: Test (default features)
        run: cargo +1.88.0 test --all-targets
      - name: Test (quic-decrypt)
        run: cargo +1.88.0 test --all-targets --features quic-decrypt

  test-latest:
    name: test (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain
        run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
      - name: Test (default features)
        run: cargo test --all-targets
      - name: Test (quic-decrypt)
        run: cargo test --all-targets --features quic-decrypt

  fuzz-smoke:
    name: fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly toolchain
        run: rustup toolchain install nightly --profile minimal
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Smoke each target
        run: |
          for t in fuzz_parse_packet fuzz_parse_capture fuzz_parse_dns fuzz_parse_linktype; do
            cargo +nightly fuzz run "$t" -- -max_total_time=60
          done
