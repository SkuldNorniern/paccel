name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install stable toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install stable toolchain
        run: rustup toolchain install stable --profile minimal --component clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (default features)
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy (quic-decrypt)
        run: cargo clippy --all-targets --features quic-decrypt -- -D warnings
      - name: Clippy (fingerprint)
        run: cargo clippy --all-targets --features fingerprint -- -D warnings
      - name: Clippy (all features)
        run: cargo clippy --all-targets --all-features -- -D warnings

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install stable toolchain
        run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
      - name: cargo doc (all features, deny warnings)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --all-features --no-deps

  test-msrv:
    name: test (MSRV 1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install MSRV toolchain
        run: rustup toolchain install 1.88.0 --profile minimal
      - uses: Swatinem/rust-cache@v2
      - name: Test (default features)
        run: cargo +1.88.0 test --all-targets
      - name: Test (quic-decrypt)
        run: cargo +1.88.0 test --all-targets --features quic-decrypt
      - name: Test (fingerprint)
        run: cargo +1.88.0 test --all-targets --features fingerprint
      - name: Test (all features)
        run: cargo +1.88.0 test --all-targets --all-features

  test-latest:
    name: test (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install stable toolchain
        run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
      - name: Test (default features)
        run: cargo test --all-targets
      - name: Test (quic-decrypt)
        run: cargo test --all-targets --features quic-decrypt
      - name: Test (fingerprint)
        run: cargo test --all-targets --features fingerprint
      - name: Test (all features)
        run: cargo test --all-targets --all-features

  differential:
    name: differential (tshark oracle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install stable toolchain
        run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
      - name: Install tshark
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tshark
      - name: Run differential test (tshark required)
        env:
          PACCEL_REQUIRE_TSHARK: "1"
        run: cargo test --test differential

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install stable toolchain
        run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
      - name: cargo package
        run: cargo package --all-features
      - name: cargo publish --dry-run
        run: cargo publish --dry-run --all-features
      - name: Confirm test fixtures never ship in the package
        run: |
          if cargo package --list --all-features | grep -q '^tests/pcaps/'; then
            echo "tests/pcaps/ leaked into the published package" >&2
            exit 1
          fi

  fuzz-smoke:
    name: fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install nightly toolchain
        run: rustup toolchain install nightly --profile minimal
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Smoke each target
        run: |
          for t in fuzz_parse_packet fuzz_parse_capture fuzz_parse_dns fuzz_parse_linktype; do
            cargo +nightly fuzz run "$t" -- -max_total_time=60
          done
