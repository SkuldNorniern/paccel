[package]
name = "paccel"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Eira"]
description = "Zero-dependency-by-default Rust packet parsing engine for pcap/pcapng capture and live traffic classification"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/SkuldNorniern/paccel"
keywords = ["packet", "pcap", "network", "parser", "protocol"]
categories = ["network-programming", "parser-implementations"]
exclude = ["tests/pcaps/", "fuzz/"]

[package.metadata.docs.rs]
all-features = true

[features]
fingerprint = ["dep:md-5", "dep:sha2"]
quic-decrypt = ["dep:aes-gcm", "dep:aes", "dep:hkdf", "dep:sha2"]

[dependencies]
aes-gcm = { version = "0.11", optional = true, default-features = false, features = ["aes", "alloc"] }
aes = { version = "0.9", optional = true }
hkdf = { version = "0.13", optional = true }
md-5 = { version = "0.11", optional = true, default-features = false }
sha2 = { version = "0.11", optional = true, default-features = false }

[dev-dependencies]
proptest = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# correctness
unwrap_used = "deny"
cognitive_complexity = "deny"
panic = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
# style / clarity
cast_lossless = "deny"
absolute_paths = "deny"
