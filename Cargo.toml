[package]
name = "paccel"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Eira"]
description = "Zero-dependency Rust packet parsing engine for pcap/pcapng capture and live traffic classification"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/SkuldNorniern/paccel"
keywords = ["packet", "pcap", "network", "parser", "protocol"]
categories = ["network-programming", "parser-implementations"]
exclude = ["tests/pcaps/", "fuzz/"]

[dependencies]

[dev-dependencies]
proptest = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# correctness
unwrap_used = "deny"
cognitive_complexity = "deny"
panic = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
# style / clarity
cast_lossless = "deny"
absolute_paths = "deny"
